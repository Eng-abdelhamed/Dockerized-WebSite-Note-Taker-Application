# version: "3"

services:
  FrontEnd:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./FrontEnd:/usr/share/nginx/html
      - ./FrontEnd/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - frontend-network

  backend:
    build:
      context: ./Backend
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/.env
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"] # healthcheck to check the backend service, it uses the curl command to make a request to the /health endpoint of the backend service. If the endpoint responds with a successful status code (2xx), the health check is considered successful.
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myapp -h localhost"] #  healthcheck to check the database connection , it uses the pg_isready command to check if the PostgreSQL server is ready to accept connections. It checks the connection using the specified username (app), database name (myapp), and host (localhost).
      interval: 10s
      timeout: 5s
      retries: 5
    
networks: # isolate networks for better security and performance, the frontend service is connected to the frontend-network, while the backend and database services are connected to the backend-network. This separation allows for better control over communication between services and enhances security by limiting access to the database from the frontend.
  frontend-network:
  backend-network:


volumes:
  postgres_data: 
