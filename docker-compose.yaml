# version: "3"

services:
  FrontEnd:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./FrontEnd:/usr/share/nginx/html
      - ./FrontEnd/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - frontend-network

  backend:
    build:
      context: ./Backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://app:secret@db:5432/myapp
      - PORT=3001
    networks:
      - backend-network
      - frontend-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=app
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=myapp
    volumes:
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

    
networks:
  frontend-network:
  backend-network:


volumes:
  postgres_data: 